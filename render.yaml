services:
  - type: web
    name: echat-api
    runtime: node
    plan: starter            # persistent disks need a paid plan; free tier loses data on restart
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: CORS_ORIGIN
        sync: false          # set to your Vercel URL, e.g. https://echat.vercel.app
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false          # password you will use to register the admin account first
    disk:
      name: echat-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
