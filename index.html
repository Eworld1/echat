<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Echat</title>
    <meta name="description" content="A real-time, full-stack social chat web application featuring news feeds, 24-hour stories, rich posts, one-to-one real-time messaging, WebRTC audio/video calls, and private developer administration." />
    <meta property="og:title" content="Echat — Connect, Share & Chat" />
    <meta property="og:description" content="A real-time, full-stack social chat web application featuring news feeds, 24-hour stories, rich posts, one-to-one real-time messaging, WebRTC audio/video calls, and private developer administration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark-blue.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EchatSl" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('echat_theme');
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        var l = localStorage.getItem('echat_language');
        if (l === 'Arabic') document.documentElement.dir = 'rtl';
      } catch (e) {}
    })();
  </script>
  <body class="bg-[#F0F2F5] text-slate-900 antialiased selection:bg-blue-600 selection:text-white font-['Inter',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
